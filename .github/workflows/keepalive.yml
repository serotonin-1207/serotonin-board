name: Keep Supabase project awake

# Free Supabase projects pause after a week without activity. A cheap database round trip every other day
# (the public serotonin_ping function) counts as activity. GitHub stops scheduled workflows in a repository that
# has had no commits for 60 days; any push re-enables them.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call serotonin_ping
        run: |
          URL=$(node -p "require('./supabase/public-config.json').supabaseUrl")
          KEY="${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          RESPONSE=$(curl -fsS -X POST "$URL/rest/v1/rpc/serotonin_ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Project answered at $RESPONSE"
